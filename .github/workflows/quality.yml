name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r requirements-test.txt

      - name: Check Python syntax
        run: python -m compileall -q src scripts tests

      - name: Validate notebook JSON
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          notebooks = sorted(Path(".").rglob("*.ipynb"))
          for path in notebooks:
              json.loads(path.read_text(encoding="utf-8"))
          print(f"Validated {len(notebooks)} notebooks")
          PY

      - name: Run tests
        run: python -m unittest discover -s tests -v
